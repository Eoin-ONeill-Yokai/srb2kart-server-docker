server {
	listen 80;
	listen [::]:80;
	
	root /var/www/html;
	server_name _;
	
	index index.html index.htm;

#	location / {
#		# First attempt to serve request as file, then
#		# as directory, then fall back to displaying a 404.
#		try_files $uri $uri/ =404;
#	}

	location / {
		autoindex on;
		disable_symlinks off;
	}
}
